name: Weekly Wiki Update

on:
  schedule:
    # Every Sunday at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml markdown

      - name: Fetch latest content from public sources
        run: python scripts/update_wiki.py

      - name: Build static HTML site
        run: python scripts/build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes — wiki is up to date."
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly wiki update: $DATE"
            git push
            echo "Pushed updates."
          fi
