name: Weekly Wiki Update

on:
  schedule:
    # Every Sunday at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run wiki updater
        run: python scripts/update_wiki.py

      - name: Commit and push if changed
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"
          git add wiki/
          if git diff --staged --quiet; then
            echo "No changes — wiki is up to date."
          else
            DATE=$(date '+%Y-%m-%d')
            git commit -m "Weekly wiki update: $DATE"
            git push
            echo "Pushed updates."
          fi
